# Project-Roma host nginx vhost — W1 target state.
# Staged — NOT yet deployed. Diff vs /etc/nginx/sites-available/balport:
#   1. http->https redirect server (unchanged, incl. ACME location)
#   2. THREE 443 vhosts: include cloudflare-realip.conf, and replace the
#      per-location proxy_set_header XFF/$proxy_add_x_forwarded_for with
#      include proxy-identity-headers.conf (single validated identity).
#      X-Real-IP $remote_addr is preserved (same file, now post-realip).
#   3. No allow/deny added — that is F4, a separate authorized change.

# REAL_IP_PATH etc. are resolved at deploy time — see deploy notes in
# nginx-staging/README.md. In deployed form the two includes read:
#   include /etc/nginx/snippets/cloudflare-realip.conf;
#   include /etc/nginx/snippets/proxy-identity-headers.conf;

server {
    listen 80;
    server_name balportliquors.com www.balportliquors.com admin.balportliquors.com api.balportliquors.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name balportliquors.com;

    include REAL_IP_SNIPPET;   # -> /etc/nginx/snippets/cloudflare-realip.conf

    ssl_certificate /etc/cloudflare/balportliquors.com.pem;
    ssl_certificate_key /etc/cloudflare/balportliquors.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include IDENTITY_SNIPPET;   # -> /etc/nginx/snippets/proxy-identity-headers.conf

        client_max_body_size 10M;
    }
}

server {
    listen 443 ssl;
    server_name admin.balportliquors.com;

    include REAL_IP_SNIPPET;   # -> /etc/nginx/snippets/cloudflare-realip.conf

    client_max_body_size 10M;

    ssl_certificate /etc/cloudflare/balportliquors.com.pem;
    ssl_certificate_key /etc/cloudflare/balportliquors.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    auth_basic "Admin Panel";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include IDENTITY_SNIPPET;   # -> /etc/nginx/snippets/proxy-identity-headers.conf

        client_max_body_size 10M;
    }
}

server {
    listen 443 ssl;
    server_name api.balportliquors.com;

    include REAL_IP_SNIPPET;   # -> /etc/nginx/snippets/cloudflare-realip.conf

    ssl_certificate /etc/cloudflare/balportliquors.com.pem;
    ssl_certificate_key /etc/cloudflare/balportliquors.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include IDENTITY_SNIPPET;   # -> /etc/nginx/snippets/proxy-identity-headers.conf

        client_max_body_size 10M;
    }
}