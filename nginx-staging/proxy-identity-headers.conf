# Sanitized forwarded-identity headers for Project-Roma host nginx (W1).
# Staged — NOT yet deployed.
#
# Include inside the proxied server/location blocks AFTER
# cloudflare-realip.conf so $remote_addr is already the validated client.
#
# Rules:
# 1. X-Real-IP  — the single authoritative identity header. Overwritten
#    unconditionally with the validated $remote_addr (post-realip).
# 2. X-Forwarded-For — rebuilt as exactly ONE entry: the validated client.
#    $proxy_add_x_forwarded_for is FORBIDDEN downstream of this boundary:
#    it preserves client-injected chains, and XFF[0] would be spoofable.
# 3. CF-Connecting-IP — stripped. Express no longer reads it (W4); clearing
#    it at the boundary removes any doubt about which copy is authoritative.

proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header CF-Connecting-IP "";