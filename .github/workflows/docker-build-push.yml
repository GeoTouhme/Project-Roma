name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_OWNER: geotoume

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/project-roma-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push customer panel
        uses: docker/build-push-action@v6
        with:
          context: ./customer-panel
          build-args: |
            REACT_APP_API_URL=https://balportliquors.com
            REACT_APP_MAINTENANCE_MODE=false
            REACT_APP_ORDERING_DISABLED=false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/project-roma-customer-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin panel
        uses: docker/build-push-action@v6
        with:
          context: ./admin-panel
          build-args: |
            VITE_API_URL=https://balportliquors.com
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/project-roma-admin-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
