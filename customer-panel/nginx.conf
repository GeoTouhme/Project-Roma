server {
    listen 80;

    # Block requests coming via the spam domain sa-unificado.site
    # (someone pointed their DNS to our IP — reject by Host header)
    if ($host ~* sa-unificado) {
        return 444;
    }
    deny 185.81.141.105;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Never cache the SPA entry so new builds are picked up immediately.
        if ($request_filename ~* /index\.html$) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Hashed static assets can be cached forever.
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket support for real-time admin notifications
    location /socket.io/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
