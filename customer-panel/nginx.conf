server {
    listen 80;

    # Block hotlinking and known bad actors
    valid_referers none blocked server_names balportliquors.com www.balportliquors.com;

    if ($invalid_referer) {
        return 403;
    }

    # Block sa-unificado.site domain and its IP
    if ($http_referer ~* sa-unificado) {
        return 403;
    }
    deny 185.81.141.105;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass http://balport-backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
