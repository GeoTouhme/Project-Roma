# Docker host nginx connects through the bridge gateway. Other peers lose supplied identity.
geo $roma_host_peer {
    default 0;
    172.18.0.1/32 1;
    127.0.0.1/32 1;
    ::1/128 1;
}
map $roma_host_peer $roma_client_ip {
    default $remote_addr;
    1 $http_x_real_ip;
}
server {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    listen 80;
    client_max_body_size 10M;

    # Block requests coming via the spam domain sa-unificado.site
    # (someone pointed their DNS to our IP — reject by Host header)
    if ($host ~* sa-unificado) {
        return 444;
    }
    deny 185.81.141.105;

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Never cache the SPA entry so new builds are picked up immediately.
        if ($request_filename ~* /index\.html$) {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Hashed static assets can be cached forever.
        location /static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }

    # Serve local product/category/brand images directly from disk.
    # This keeps image traffic off the backend Express process.
    location /api/images/ {
        if ($uri !~* \.(jpe?g|png|webp|gif|avif)$) { return 404; }
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        alias /usr/share/nginx/html/images/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Dynamic sitemap — proxied from backend so it always reflects live DB content.
    # Search engines and robots.txt both reference https://balportliquors.com/sitemap.xml.
    location = /sitemap.xml {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # W3: forward ONLY the validated identity from host nginx (single entry).
        proxy_set_header X-Real-IP $roma_client_ip;
        proxy_set_header X-Forwarded-For $roma_client_ip;
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "public, max-age=3600, s-maxage=3600" always;
    }

    location /api/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # W3: forward ONLY the validated identity from host nginx (single entry).
        proxy_set_header X-Real-IP $roma_client_ip;
        proxy_set_header X-Forwarded-For $roma_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket support for real-time admin notifications
    location /socket.io/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # W3: forward ONLY the validated identity from host nginx (single entry).
        proxy_set_header X-Real-IP $roma_client_ip;
        proxy_set_header X-Forwarded-For $roma_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 86400;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        root   /usr/share/nginx/html;
    }
}
