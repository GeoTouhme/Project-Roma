# Use Docker BuildKit for faster builds with cache mounts:
#   export DOCKER_BUILDKIT=1
# Or enable permanently in /etc/docker/daemon.json:
#   { "features": { "buildkit": true } }
#
# Production deploys use the protected environment and frozen image/hardening
# manifests under /etc/project-roma:
#   sudo /usr/local/sbin/roma-compose up -d --no-build --pull never
# The existing production bridge is external in the hardening overlay so Compose
# preserves its active endpoints. Development must use separate credentials.

services:
  mongodb:
    image: mongo@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ["mongod", "--auth", "--bind_ip_all"]
    container_name: balport-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      database-private:
        ipv4_address: 172.30.71.2

  backend:
    build: ./backend
    container_name: balport-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - EMAIL=${EMAIL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - RECEIVING_EMAIL=${RECEIVING_EMAIL:-}
      - SHIPPING_FEE=${SHIPPING_FEE:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CURRENCY=${CURRENCY:-usd}
      - JWT_SECRET=${JWT_SECRET}
      - MFA_SECRET_KEY=${MFA_SECRET_KEY:-${JWT_SECRET}}
      - MFA_PREVIOUS_SECRET_KEY=${MFA_PREVIOUS_SECRET_KEY:-}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://balportliquors.com,https://www.balportliquors.com,https://admin.balportliquors.com}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_PUBLISHABLE_KEY=${CLOUDINARY_PUBLISHABLE_KEY}
      - CLOUDINARY_SECRET_KEY=${CLOUDINARY_SECRET_KEY}
      - DOORDASH_DEVELOPER_ID=${DOORDASH_DEVELOPER_ID}
      - DOORDASH_KEY_ID=${DOORDASH_KEY_ID}
      - DOORDASH_SIGNING_SECRET=${DOORDASH_SIGNING_SECRET}
      - DOORDASH_ENV=${DOORDASH_ENV:-sandbox}
      - UBER_DIRECT_CLIENT_ID=${UBER_DIRECT_CLIENT_ID}
      - UBER_DIRECT_CLIENT_SECRET=${UBER_DIRECT_CLIENT_SECRET}
      - UBER_DIRECT_CUSTOMER_ID=${UBER_DIRECT_CUSTOMER_ID}
      - UBER_DIRECT_WEBHOOK_SECRET=${UBER_DIRECT_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://balportliquors.com}
      - IMAGE_FALLBACK_DIR=/usr/src/app/image-fallback/storage/images
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - LOG_REPORT_RECIPIENTS=${LOG_REPORT_RECIPIENTS:-}
      - TZ=${TZ:-America/Los_Angeles}
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./image-fallback/storage/images:/usr/src/app/image-fallback/storage/images
    networks:
      balport-network:
        ipv4_address: 172.18.0.6
      database-private:
        ipv4_address: 172.30.71.3

  customer-panel:
    build:
      context: ./customer-panel
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - REACT_APP_GOOGLE_MAPS_KEY=${REACT_APP_GOOGLE_MAPS_KEY}
        - REACT_APP_MAINTENANCE_MODE=false
        - REACT_APP_ORDERING_DISABLED=false
        - REACT_APP_STRIPE_PUBLIC_KEY=${REACT_APP_STRIPE_PUBLIC_KEY}
    container_name: balport-customer-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./image-fallback/storage/images:/usr/share/nginx/html/images:ro
    networks:
      balport-network:
        ipv4_address: 172.18.0.3

  admin-panel:
    build:
      context: ./admin-panel
      args:
        - VITE_API_URL=/
    container_name: balport-admin-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      balport-network:
        ipv4_address: 172.18.0.4

  image-fallback:
    build: ./image-fallback
    container_name: balport-image-fallback
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./image-fallback/storage/images:/usr/share/nginx/html/images:ro
    networks:
      balport-network:
        ipv4_address: 172.18.0.5
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=4m"]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  database-private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.71.0/24
  balport-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  mongodb_data:
