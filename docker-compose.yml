version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: balport-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - balport-network

  backend:
    build: ./backend
    container_name: balport-backend
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/liquor_shop
      - ALLOWED_ORIGINS=https://balportliquors.com,http://balportliquors.com,https://www.balportliquors.com,http://localhost:3000,http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/usr/src/app/uploads
    networks:
      - balport-network

  customer-panel:
    build:
      context: ./customer-panel
      args:
        - REACT_APP_API_URL=
        - REACT_APP_GOOGLE_MAPS_KEY=${REACT_APP_GOOGLE_MAPS_KEY}
        - REACT_APP_MAINTENANCE_MODE=false
        - REACT_APP_ORDERING_DISABLED=true
    container_name: balport-customer-panel
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - balport-network

  admin-panel:
    build:
      context: ./admin-panel
      args:
        - VITE_API_URL=https://balportliquors.com
    container_name: balport-admin-panel
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - balport-network

networks:
  balport-network:
    driver: bridge

volumes:
  mongodb_data:
