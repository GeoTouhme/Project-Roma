version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: balport-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - balport-network

  backend:
    build: ./backend
    container_name: balport-backend
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/liquor_shop
      # ALLOWED_ORIGINS: comma-separated list of trusted frontend origins for CORS
      # Example: http://localhost:3000,https://yourdomain.com
      # Add other env vars here or use an env_file
      - ALLOWED_ORIGINS=http://151.145.90.89,http://151.145.90.89:3000,http://151.145.90.89:5173,http://localhost:3000,http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/usr/src/app/uploads
    networks:
      - balport-network

  customer-panel:
    build:
      context: ./customer-panel
      # Set API URL build arg to point to the backend container or public IP
      # For localhost testing, use http://localhost:5001
      # For production, use your server's IP/domain
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5001}
    container_name: balport-customer-panel
    ports:
      - "${CUSTOMER_PANEL_PORT:-3000}:80"
    networks:
      - balport-network

  admin-panel:
    build:
      context: ./admin-panel
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5001}
    container_name: balport-admin-panel
    ports:
      - "${ADMIN_PANEL_PORT:-5173}:80"
    networks:
      - balport-network

networks:
  balport-network:
    driver: bridge

volumes:
  mongodb_data:
