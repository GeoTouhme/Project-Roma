# Use Docker BuildKit for faster builds with cache mounts:
#   export DOCKER_BUILDKIT=1
# Or enable permanently in /etc/docker/daemon.json:
#   { "features": { "buildkit": true } }
#
# Secrets are sourced from /etc/project-roma/.env (chmod 600, owned by root).
# A symlink at /var/www/Project-Roma/.env points to that file so Docker Compose
# automatically loads the variables for both substitution and container env.
# For local dev: create .env.local in this directory and run:
#   docker compose --env-file .env.local up --build
# The backend/.env.example file lists every variable this compose file expects.

services:
  mongodb:
    image: mongo:latest
    container_name: balport-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - balport-network

  backend:
    build: ./backend
    container_name: balport-backend
    ports:
      - "0.0.0.0:5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - EMAIL=${EMAIL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - RECEIVING_EMAIL=${RECEIVING_EMAIL:-}
      - SHIPPING_FEE=${SHIPPING_FEE:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CURRENCY=${CURRENCY:-usd}
      - JWT_SECRET=${JWT_SECRET}
      - MFA_SECRET_KEY=${MFA_SECRET_KEY:-${JWT_SECRET}}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://balportliquors.com,https://www.balportliquors.com,https://admin.balportliquors.com}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_PUBLISHABLE_KEY=${CLOUDINARY_PUBLISHABLE_KEY}
      - CLOUDINARY_SECRET_KEY=${CLOUDINARY_SECRET_KEY}
      - DOORDASH_DEVELOPER_ID=${DOORDASH_DEVELOPER_ID}
      - DOORDASH_KEY_ID=${DOORDASH_KEY_ID}
      - DOORDASH_SIGNING_SECRET=${DOORDASH_SIGNING_SECRET}
      - DOORDASH_ENV=${DOORDASH_ENV:-sandbox}
      - UBER_DIRECT_CLIENT_ID=${UBER_DIRECT_CLIENT_ID}
      - UBER_DIRECT_CLIENT_SECRET=${UBER_DIRECT_CLIENT_SECRET}
      - UBER_DIRECT_CUSTOMER_ID=${UBER_DIRECT_CUSTOMER_ID}
      - UBER_DIRECT_WEBHOOK_SECRET=${UBER_DIRECT_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://balportliquors.com}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - LOG_REPORT_RECIPIENTS=${LOG_REPORT_RECIPIENTS:-}
      - TZ=${TZ:-America/Los_Angeles}
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/usr/src/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - balport-network

  customer-panel:
    build:
      context: ./customer-panel
      args:
        - REACT_APP_API_URL=http://192.168.88.218:5001
        - REACT_APP_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - REACT_APP_GOOGLE_MAPS_KEY=${REACT_APP_GOOGLE_MAPS_KEY}
        - REACT_APP_MAINTENANCE_MODE=false
        - REACT_APP_ORDERING_DISABLED=false
        - REACT_APP_STRIPE_PUBLIC_KEY=${REACT_APP_STRIPE_PUBLIC_KEY}
    container_name: balport-customer-panel
    ports:
      - "0.0.0.0:3000:80"
    networks:
      - balport-network

  admin-panel:
    build:
      context: ./admin-panel
      args:
        - VITE_API_URL=https://balportliquors.com
    container_name: balport-admin-panel
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - balport-network

networks:
  balport-network:
    driver: bridge

volumes:
  mongodb_data:
