server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API requests if needed (though we use VITE_API_URL absolute path)
    # location /api {
    #     proxy_pass http://backend:5001;
    # }
}
