server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 🛡️ SECURITY (VULN-001): Server-side auth before serving any admin content.
    # Without this, any request to /admin/ returns HTTP 200 + full HTML (pentest confirmed).
    # Client-side <ProtectedRoute> alone is NOT sufficient — it runs AFTER the bundle loads.
    #
    # To generate credentials on the server:
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd admin
    #   (then restart nginx)
    #
    # For IP-allowlist instead, comment out auth_basic lines and uncomment the allow/deny block below.
    # auth_basic           "Balport Admin — Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # --- Alternative: IP allowlist only ---
    # allow 203.0.113.10;  # <-- replace with your office/VPN IP
    # deny  all;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

