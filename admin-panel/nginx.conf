# Docker host nginx connects through the bridge gateway. Other peers lose supplied identity.
geo $roma_host_peer {
    default 0;
    172.18.0.1/32 1;
    127.0.0.1/32 1;
    ::1/128 1;
}
map $roma_host_peer $roma_client_ip {
    default $remote_addr;
    1 $http_x_real_ip;
}
server {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # 🛡️ SECURITY: Server-side auth before serving any admin content.
    # The admin panel MUST be served only on a restricted origin (e.g. admin.balportliquors.com
    # or an IP-restricted path). Client-side <ProtectedRoute> alone is NOT sufficient.
    #
    # To generate credentials on the server:
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd admin
    #   (then restart nginx)
    #
    # For IP-allowlist instead, comment out auth_basic lines and uncomment the allow/deny block below.
    auth_basic           "Balport Admin — Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # --- Alternative: IP allowlist only ---
    # allow 203.0.113.10;  # <-- replace with your office/VPN IP
    # deny  all;

    # WebSocket support for real-time admin notifications
    # The socket is authenticated via JWT, not basic auth.
    location /socket.io/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        auth_basic off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # W3: forward ONLY the validated identity from host nginx (single entry).
        proxy_set_header X-Real-IP $roma_client_ip;
        proxy_set_header X-Forwarded-For $roma_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 86400;
    }

    # Proxy API calls to the backend so the admin panel can use same-origin /api URLs.
    location /api/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://balport-backend:5001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # W3: forward ONLY the validated identity from host nginx (single entry).
        proxy_set_header X-Real-IP $roma_client_ip;
        proxy_set_header X-Forwarded-For $roma_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;

        # Never cache the SPA entry so new builds are picked up immediately.
        if ($request_filename ~* /index\.html$) {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Hashed static assets can be cached forever.
        location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }
}

