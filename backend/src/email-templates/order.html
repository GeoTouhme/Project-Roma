<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Order Placement</title>
		<style>
			body {
				font-family: "Poppins", sans-serif;
				background-color: #f7f7ff;
				margin: 0;
				padding: 0;
				font-size: 12px;
				color: #000;
				line-height: 22px;
			}

			.container {
				max-width: 600px;
				margin: 20px auto;
				padding: 20px;
			}

			.card {
				background-color: #ffffff;
				border-radius: 10px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
				padding: 20px;
			}

			.header {
				text-align: center;
				margin-bottom: 20px;
			}

			.logo {
				max-width: 100px;
				height: auto;
			}

			.user-info {
				margin-bottom: 20px;
			}

			.order-details {
				border-collapse: collapse;
				width: 100%;
				margin-bottom: 20px;
				border: 8px solid #ffffff; /* Add border */
				border-radius: 5px; /* Add border radius */
				overflow: hidden; /* Hide overflowing content */
			}

			.order-details th,
			.order-details td {
				border: 1px solid #dddddd;
				text-align: center;
				padding: 8px;
			}

			.order-details th {
				background-color: #B5223B;
				color: #ffffff;
			}

			.order-total {
				/* width: 100px; */
				border-collapse: collapse;
				text-align: right;
				width: auto;
				margin-right: 0px;
				margin-left: auto;
				gap: 8px;
				padding-left: 30px;
				font-weight: bold;
			}

			.order-total td:first-child {
				font-weight: bold;
				text-align: right;
				margin-right: 12px; /* Add right margin to the label cells */
			}

			.order-total td:last-child {
				text-align: left; /* Adjust text alignment of the value cells */
			}

			.order-total th {
				text-align: right;
			}
			.text-right {
				text-align: right; /* Aligns the content to the right */
			}

			@media only screen and (max-width: 600px) {
				.container {
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="card">
				<div class="header">
					<h2>Hello, {{recipientName}}</h2>
					<p style="font-size: 14px; font-weight: bold; color: #B5223B; margin-top: 5px;">
						{{orderHeadline}}
					</p>
					<div style="background: #fdf2f2; border: 1px solid #f9d6d6; border-radius: 8px; padding: 12px; margin: 15px 0; text-align: left;">
						{{fulfillmentInfo}}
					</div>
				</div>
				<table class="order-details" border="0">
					<thead>
						<tr>
							<th style="border-spacing: 0; border: 0">Image</th>
							<th style="border-spacing: 0; border: 0">Product Name</th>
							<th style="border-spacing: 0; border: 0">SKU</th>
							<th style="border-spacing: 0; border: 0">Quantity</th>
							<th style="border-spacing: 0; border: 0">Subtotal</th>
						</tr>
					</thead>
					<tbody>
						{{items}}
					</tbody>
				</table>

				<table class="order-total">
					{{trackingInfo}}
					<tr>
						<td style="border-spacing: 0; border: 0">Subtotal :</td>
						<td style="border-spacing: 0; border: 0">{{subTotal}}</td>
					</tr>
					<tr>
						<td style="border-spacing: 0; border: 0">Discount :</td>
						<td style="border-spacing: 0; border: 0">{{discount}}</td>
					</tr>
					{{fulfillmentFeeRow}}
					<tr>
						<td style="border-spacing: 0; border: 0">Markup :</td>
						<td style="border-spacing: 0; border: 0">{{markup}}</td>
					</tr>
					<tr>
						<td style="border-spacing: 0; border: 0">Tax :</td>
						<td style="border-spacing: 0; border: 0">{{tax}}</td>
					</tr>
					{{tipRow}}
					<tr>
						<td style="border-spacing: 0; border: 0">Grand Total :</td>
						<td style="border-spacing: 0; border: 0">{{grandTotal}}</td>
					</tr>
				</table>
			</div>
		</div>
	</body>
</html>
