# Apply only after the documented backup, restore, auth-bootstrap, and candidate checks.
services:
  mongodb:
    image: mongo@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ["mongod", "--auth", "--bind_ip_all"]
    user: "999:999"
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999
    volumes:
      - /etc/project-roma/mongo-backup.yml:/run/secrets/mongo-backup.yml:ro
    networks: !override
      database-private:
        ipv4_address: 172.30.71.2
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
  backend:
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /app/uploads:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    networks:
      database-private:
        ipv4_address: 172.30.71.3
    environment:
      MONGODB_URI: ${ROMA_AUTHENTICATED_MONGODB_URI:?Generate the protected database credentials first}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
  customer-panel:
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=4m"]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  admin-panel:
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=4m"]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  balport-network: !override
    external: true
    name: project-roma_balport-network
  database-private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.71.0/24
